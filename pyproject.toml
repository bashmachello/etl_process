[project]
name = "thirdsemestrwork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bashmachello", email = "ipaspiridonov@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
thirdsemestrwork = "thirdsemestrwork:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length =  100
src = ['src']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B']
